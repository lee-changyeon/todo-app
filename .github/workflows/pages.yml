# todo-app/ (루트), todo-app2/ (/todo-app2/), todo-app3/ (/todo-app3/)를 GitHub Pages로 배포합니다.
# main 브랜치에 push할 때마다 자동으로 실행됩니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # todo-app은 사이트 루트에, todo-app2 · todo-app3은 /todo-app2/ · /todo-app3/ 경로에 배치한다.
      # (기획 문서 *.md는 배포하지 않고 앱 파일 3개만 복사한다)
      - name: Build site folder
        run: |
          mkdir _site
          cp -r todo-app/. _site/
          for app in todo-app2 todo-app3; do
            mkdir "_site/$app"
            cp "$app/index.html" "$app/style.css" "$app/app.js" "_site/$app/"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
